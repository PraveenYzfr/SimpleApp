name = "simpleapp"
main = "src/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Keep dashboard Text vars (SESSION_SECRET etc.) across Git deploys.
# Secrets are never deleted by deploy; Text vars are wiped unless this is true.
keep_vars = true

# Static UI: landing + demo
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
# Worker must run first so `/` → landing and `/demo/` → demo HTML rewrites work
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "simpleapp"
database_id = "273c6350-2b15-46b4-87e5-7f4fbfa95716"

# Local secrets for `wrangler dev` — production uses `wrangler secret put`
# SESSION_SECRET, AUTH_ADMIN_EMAIL, AUTH_ADMIN_PASSWORD, AUTH_ADMIN_NAME
[vars]
COOKIE_SECURE = "true"
