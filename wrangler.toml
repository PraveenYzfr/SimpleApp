name = "simpleapp"
main = "src/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Static UI: landing + demo
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "simpleapp"
# Replace after: npx wrangler d1 create simpleapp
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Local secrets for `wrangler dev` — production uses `wrangler secret put`
# SESSION_SECRET, AUTH_ADMIN_EMAIL, AUTH_ADMIN_PASSWORD, AUTH_ADMIN_NAME
[vars]
COOKIE_SECURE = "true"
